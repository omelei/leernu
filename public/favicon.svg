<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="leer.nu">
  <title>leer.nu</title>
  <!--
    The mark, taken from docs/Logo/leer-nu-favicon-32.svg with the C2PA
    metadata stripped: an ink tile with the dot in paper, ring one twelfth of
    the dot's diameter and filled to 62%. Same geometry as src/components/Dot.tsx,
    which reproduces it exactly.

    No font, no external reference and nothing to fetch — a favicon is the first
    request a browser makes, and it is not going to be to somebody else.

    Below 16px the dot goes solid (styleguide §A). A browser rendering this SVG
    into a 16px slot scales the whole tile rather than switching variants, which
    is the one place the simplification cannot be applied automatically; see
    docs/Logo/leer-nu-favicon-16.svg for the drawn version of it.
  -->
  <rect width="32" height="32" rx="6" fill="#1D221C"/>
  <circle cx="16" cy="16" r="7.792" fill="none" stroke="#FAFAF7" stroke-width="1.417"/>
  <clipPath id="favicon-dot">
    <circle cx="16" cy="16" r="7.083"/>
  </clipPath>
  <rect x="8.917" y="14.3" width="14.167" height="8.783" fill="#FAFAF7" clip-path="url(#favicon-dot)"/>
</svg>

# Is the site up?
#
# CI proves the build is good. Until this file there was nothing that proved
# the site was *reachable*, and the difference showed the first time a browser
# answered ERR_CONNECTION_CLOSED on www.leer.nu: green runs all the way down,
# a deploy that reported success, and no way to tell whether the site had been
# down for four seconds or forty minutes — because by the time anyone looked
# it was answering again.
#
# That error happens under HTTP. The connection opens and the far end closes it
# before a byte comes back, which is a thing GitHub's edge, a certificate that
# is being re-issued, or a box on the child's own network can do, and a thing
# no amount of application code can do. So this does not try to prevent it. It
# watches for it, from outside, every quarter of an hour, and writes down what
# was true at that minute.
#
# The record is a single issue. A failing run opens it or adds to it, and the
# first run that passes closes it with the time. What that gives, after a
# month, is the question that actually matters: does it fail on the quarter
# hour after a deploy, at one edge address, on IPv6, or only ever in one house.
name: Beschikbaarheid

on:
  schedule:
    # Four an hour. A blip shorter than that is invisible to this, and making it
    # finer means paying a runner minute to watch nothing happen 96 times a day
    # instead of 96 — the cheap fix for a missed blip is the record of the ones
    # around it, not a faster clock.
    - cron: '*/15 * * * *'
  # A deploy is the moment the site is most likely to be briefly wrong, so it
  # is checked then rather than up to fifteen minutes later.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  # A late scheduled run must not comment on top of the one before it.
  group: beschikbaarheid
  cancel-in-progress: false

jobs:
  kijken:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # No `npm ci`: the probe imports nothing but Node itself, on purpose.
      # A check on whether the site is up should not be able to fail because
      # the registry is down.
      - name: Ask the site
        id: probe
        shell: bash
        run: |
          set +e
          node tools/beschikbaarheid.mjs > verslag.txt 2>&1
          code=$?
          cat verslag.txt
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Keep the record
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('verslag.txt', 'utf8').trim();
            const down = '${{ steps.probe.outputs.code }}' !== '0';
            const label = 'beschikbaarheid';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = ['```', report, '```', '', `— [this run](${run})`].join('\n');

            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
              per_page: 1,
            });
            const existing = open[0];

            if (down && !existing) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'www.leer.nu did not answer',
                labels: [label],
                body: [
                  'The availability check could not reach the site. Every run that',
                  'fails from here on adds to this issue, and the first run that',
                  'passes closes it, so the timeline below is the outage.',
                  '',
                  body,
                ].join('\n'),
              });
              return;
            }

            if (down && existing) {
              // One comment an hour at most. An outage lasting a day should
              // read as a day, not as ninety-six identical comments.
              const quiet = Date.now() - Date.parse(existing.updated_at) > 3_600_000;
              if (quiet) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  body: ['Still not answering.', '', body].join('\n'),
                });
              }
              return;
            }

            if (!down && existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: ['Answering again.', '', body].join('\n'),
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: 'closed',
              });
            }
      - name: Fail the run if the site did not answer
        if: steps.probe.outputs.code != '0'
        run: exit 1

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      # Only for the formatting commit below. Everything else here reads.
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Named rather than the detached SHA a push event checks out, so the
          # formatting step below has a branch to push back to.
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Listed step by step rather than as `npm run check`, so a red run names
      # what failed on the job page instead of one collapsed script. The local
      # script runs the same commands in the same order with one difference,
      # below: it asserts the formatting and this applies it.
      - run: npm run lint
      - run: npm run typecheck
      # Prettier is applied here rather than asserted, and it is the only check
      # in this file that gets that treatment.
      #
      # The reason is ADR-001: the machine most of this is written on cannot
      # reach the npm registry, so there is no formatter there to obey. Failing
      # the build for it turned every disagreement about where a line breaks
      # into a red run and an e-mail — eleven of the sixteen failures in one
      # night, none of which any human had an opinion about.
      #
      # It is still enforced. The commit is made here, so the branch ends up
      # formatted either way; what changes is that a formatter and a person no
      # longer argue through the build.
      - name: Format
        run: npx prettier --write .
      - name: Commit the formatting, if there was any
        # Tolerated rather than required. This repository gives workflows read
        # access by default, so the push may be refused — and a build that goes
        # red over where a line breaks is the thing being fixed here. If it is
        # refused the run stays green with the step marked, and the formatting
        # lands the next time anyone runs `npm run format`.
        continue-on-error: true
        run: |
          if git diff --quiet; then
            echo "Nothing to format."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # This message deliberately carries no skip-ci marker, and it is
          # worth saying why rather than leaving the next person to rediscover
          # it. Note that the marker is not spelled out anywhere in this file
          # either: a message quoting it works exactly as well as one meaning
          # it, which is the second half of the same lesson.
          #
          # A formatting commit has nothing left to check, so skipping its own
          # run was right. What was wrong is where the marker ends up. A squash
          # merge folds every commit message on the branch into the body of the
          # single commit that lands on main, and GitHub reads the marker in a
          # body as readily as in a subject. So the merge that was supposed to
          # publish ran nothing at all: no checks, no deploy, and a green tick
          # on the pull request saying everything had passed.
          #
          # One redundant run per formatting commit costs four minutes. A deploy
          # that does not happen and does not say so costs however long it takes
          # someone to notice the site did not change.
          git commit -am 'Run Prettier'
          git pull --rebase --autostash
          git push
      # A broken geometry reference must never reach a classroom.
      - run: npm run validate:content
      - run: npm test
      - run: npm run build

  # ---- The one job on the critical path that is worth splitting -------------
  #
  # This and `lighthouse` both wait for `check`. They used to run beside it, so
  # one commit that did not compile produced three failing jobs and three
  # notifications, and spent eight minutes of runner time proving the same
  # thing three times. With three e2e runners it would now be five.
  #
  # Measured on the deploy of 830ad64, in seconds of the run's own clock:
  #
  #   check       44   lint, typecheck, Prettier, 447 unit tests, build
  #   lighthouse  89   runs beside e2e, so it is never the long pole
  #   e2e        303   36 of it installing browsers, 252 running the suite
  #   deploy      24
  #
  # The path to production is check -> e2e -> deploy, so six minutes of the app
  # being fixed and not yet fixed is 252 seconds of Playwright and about two of
  # everything else. Six sizes in two engines is what makes it that long, and
  # none of that is waste — it is the check that finds the bugs this build has
  # actually shipped.
  #
  # So it is divided rather than reduced. Not by `--shard`, which was tried
  # first and does not work here: it balances by counting tests, and these
  # tests are nothing like equal — one screenshot test photographs six screens
  # and an assertion test presses a button. Measured, that gave 127s, 149s and
  # 258s, so the run still waited on 258 and the whole exercise bought forty
  # seconds.
  #
  # By project it balances by construction. Every project runs the identical
  # list, so two of the six is two sixths of the work whichever two they are —
  # and pairing one Chromium size with one WebKit size on each runner keeps the
  # slower engine from piling up on one of them.
  #
  # `fail-fast: false` because a failure on the iPad and a failure on Android
  # are two different bugs, and stopping the others hides the second one until
  # the first is fixed.
  e2e:
    needs: [check]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: laptop-en-ipad-staand
            projects: --project=chromebook --project=ipad-portrait
          - group: desktop-en-iphone
            projects: --project=desktop-1440 --project=iphone
          - group: android-en-ipad-liggend
            projects: --project=android --project=ipad-landscape
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # The browsers are 36 seconds of every runner and they change only when
      # the pinned Playwright version does, so the version is the key. A miss
      # installs them exactly as before; there is no path where this is wrong,
      # only one where it is slow.
      - id: playwright-version
        run: echo "value=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.value }}
      # WebKit as well as Chromium: an iPad in a classroom is Safari, and the
      # layout problems that only WebKit shows are exactly the ones a school
      # would hit first. Chromium in an iPad-sized viewport would not find them.
      #
      # `--with-deps` installs system libraries outside the cached directory, so
      # it runs either way; only the browser download is skipped on a hit.
      - run: npx playwright install --with-deps chromium webkit
        if: steps.playwright-cache.outputs.cache-hit != 'true'
      - run: npx playwright install-deps chromium webkit
        if: steps.playwright-cache.outputs.cache-hit == 'true'
      - run: npm run test:e2e -- ${{ matrix.projects }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.group }}
          path: playwright-report/
          retention-days: 7
      # Spec section 8: the screens at every size the app claims to work at.
      # Uploaded separately from the report because these are meant to be
      # looked at, not dug out of a zip — and because nobody here owns an
      # Android phone or an iPad to look at them on.
      #
      # One artifact per shard, merged back into one below. v4 will not let two
      # jobs write the same artifact name, and three folders to open would undo
      # the reason this is uploaded apart from the report in the first place.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: screenshots-${{ matrix.group }}
          path: screenshots/
          retention-days: 7

  # The three shards' screenshots, back under the one name they had before.
  # Deliberately not in `deploy`'s needs: this is for a person to look at, and
  # a merge that failed should not stop a release that passed.
  screenshots:
    needs: [e2e]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact/merge@v4
        with:
          name: screenshots
          pattern: screenshots-*
          delete-merged: true
          retention-days: 7

  lighthouse:
    needs: [check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      # Definition of done, spec section 11: performance >= 85 and
      # accessibility >= 95. Measured on every push rather than once by hand,
      # because a number nobody re-measures is a number that quietly rots.
      - run: npm run lighthouse
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: lighthouse-report
          path: lighthouse-report/
          retention-days: 7

  # Publishing is gated on the two jobs above. This is a product for children on
  # a real domain; a build that fails its own tests must not be the one that
  # reaches it, and "we forgot to check" is not a thing CI should allow.
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [check, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Repository variable. Leave it unset for a project page at
          # /<repo>/; set it to / once a custom domain is pointed here.
          BASE_PATH: ${{ vars.BASE_PATH || format('/{0}/', github.event.repository.name) }}
      - uses: actions/configure-pages@v5
      # If this run is a re-run, the artifact uploaded by the previous attempt
      # is still there and `deploy-pages` finds two called `github-pages` and
      # refuses. That is the one deploy failure in this repository's history
      # that was not a broken commit. The remedy is a new commit rather than a
      # re-run — artifacts belong to the run, and a second attempt does not
      # clear the first one's.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4

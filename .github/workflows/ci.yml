name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      # Only for the formatting commit below. Everything else here reads.
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Named rather than the detached SHA a push event checks out, so the
          # formatting step below has a branch to push back to.
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Listed step by step rather than as `npm run check`, so a red run names
      # what failed on the job page instead of one collapsed script. The local
      # script runs the same commands in the same order with one difference,
      # below: it asserts the formatting and this applies it.
      - run: npm run lint
      - run: npm run typecheck
      # Prettier is applied here rather than asserted, and it is the only check
      # in this file that gets that treatment.
      #
      # The reason is ADR-001: the machine most of this is written on cannot
      # reach the npm registry, so there is no formatter there to obey. Failing
      # the build for it turned every disagreement about where a line breaks
      # into a red run and an e-mail — eleven of the sixteen failures in one
      # night, none of which any human had an opinion about.
      #
      # It is still enforced. The commit is made here, so the branch ends up
      # formatted either way; what changes is that a formatter and a person no
      # longer argue through the build.
      - name: Format
        run: npx prettier --write .
      - name: Commit the formatting, if there was any
        # Tolerated rather than required. This repository gives workflows read
        # access by default, so the push may be refused — and a build that goes
        # red over where a line breaks is the thing being fixed here. If it is
        # refused the run stays green with the step marked, and the formatting
        # lands the next time anyone runs `npm run format`.
        continue-on-error: true
        run: |
          if git diff --quiet; then
            echo "Nothing to format."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # This message deliberately carries no skip-ci marker, and it is
          # worth saying why rather than leaving the next person to rediscover
          # it. Note that the marker is not spelled out anywhere in this file
          # either: a message quoting it works exactly as well as one meaning
          # it, which is the second half of the same lesson.
          #
          # A formatting commit has nothing left to check, so skipping its own
          # run was right. What was wrong is where the marker ends up. A squash
          # merge folds every commit message on the branch into the body of the
          # single commit that lands on main, and GitHub reads the marker in a
          # body as readily as in a subject. So the merge that was supposed to
          # publish ran nothing at all: no checks, no deploy, and a green tick
          # on the pull request saying everything had passed.
          #
          # One redundant run per formatting commit costs four minutes. A deploy
          # that does not happen and does not say so costs however long it takes
          # someone to notice the site did not change.
          git commit -am 'Run Prettier'
          git pull --rebase --autostash
          git push
      # A broken geometry reference must never reach a classroom.
      - run: npm run validate:content
      - run: npm test
      - run: npm run build

  # Both of these wait for `check`. They used to run beside it, so one commit
  # that did not compile produced three failing jobs and three notifications,
  # and spent eight minutes of runner time proving the same thing three times.
  e2e:
    needs: [check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # WebKit as well as Chromium: an iPad in a classroom is Safari, and the
      # layout problems that only WebKit shows are exactly the ones a school
      # would hit first. Chromium in an iPad-sized viewport would not find them.
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      # Spec section 8: the screens at every size the app claims to work at.
      # Uploaded separately from the report because these are meant to be
      # looked at, not dug out of a zip — and because nobody here owns an
      # Android phone or an iPad to look at them on.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: screenshots
          path: screenshots/
          retention-days: 7

  lighthouse:
    needs: [check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      # Definition of done, spec section 11: performance >= 85 and
      # accessibility >= 95. Measured on every push rather than once by hand,
      # because a number nobody re-measures is a number that quietly rots.
      - run: npm run lighthouse
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: lighthouse-report
          path: lighthouse-report/
          retention-days: 7

  # Publishing is gated on the two jobs above. This is a product for children on
  # a real domain; a build that fails its own tests must not be the one that
  # reaches it, and "we forgot to check" is not a thing CI should allow.
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [check, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Repository variable. Leave it unset for a project page at
          # /<repo>/; set it to / once a custom domain is pointed here.
          BASE_PATH: ${{ vars.BASE_PATH || format('/{0}/', github.event.repository.name) }}
      - uses: actions/configure-pages@v5
      # If this run is a re-run, the artifact uploaded by the previous attempt
      # is still there and `deploy-pages` finds two called `github-pages` and
      # refuses. That is the one deploy failure in this repository's history
      # that was not a broken commit. The remedy is a new commit rather than a
      # re-run — artifacts belong to the run, and a second attempt does not
      # clear the first one's.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Listed step by step rather than as `npm run check`, so a red run names
      # what failed on the job page instead of one collapsed script. The script
      # exists for local use and runs the same commands in the same order — add
      # a step to one and add it to the other.
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      # Prettier names the files it disagrees with but not the disagreement,
      # and this repository is written on a machine where its toolchain cannot
      # run. On a red check the diff is the answer, so print it here rather
      # than guess at it from the file names.
      - name: Show what Prettier would change
        if: failure()
        run: |
          npx prettier --write . > /dev/null
          git --no-pager diff
      # A broken geometry reference must never reach a classroom.
      - run: npm run validate:content
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # WebKit as well as Chromium: an iPad in a classroom is Safari, and the
      # layout problems that only WebKit shows are exactly the ones a school
      # would hit first. Chromium in an iPad-sized viewport would not find them.
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      # Spec section 8: the screens at every size the app claims to work at.
      # Uploaded separately from the report because these are meant to be
      # looked at, not dug out of a zip — and because nobody here owns an
      # Android phone or an iPad to look at them on.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: screenshots
          path: screenshots/
          retention-days: 7

  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      # Definition of done, spec section 11: performance >= 85 and
      # accessibility >= 95. Measured on every push rather than once by hand,
      # because a number nobody re-measures is a number that quietly rots.
      - run: npm run lighthouse
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: lighthouse-report
          path: lighthouse-report/
          retention-days: 7

  # Publishing is gated on the two jobs above. This is a product for children on
  # a real domain; a build that fails its own tests must not be the one that
  # reaches it, and "we forgot to check" is not a thing CI should allow.
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [check, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Repository variable. Leave it unset for a project page at
          # /<repo>/; set it to / once a custom domain is pointed here.
          BASE_PATH: ${{ vars.BASE_PATH || format('/{0}/', github.event.repository.name) }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
